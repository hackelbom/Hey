name: Build SMS Sender APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Detect Android project directory
        id: project
        shell: bash
        run: |
          if [ -f "settings.gradle" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "SmsSender/settings.gradle" ]; then
            echo "dir=SmsSender" >> "$GITHUB_OUTPUT"
          else
            echo "Android project (settings.gradle) not found."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Verify Firebase configuration
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "::error::app/google-services.json is missing."
            exit 1
          fi

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sms-sender-release-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
